<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;

        }

        body {
            background-color: rgb(208, 208, 208);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            height: 600px;
            width: 400px;
            background-color: white;
            padding: 60px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: blueviolet;
        }


        label {
            font-size: 25px;
            color: blueviolet;
            font-weight: 500;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            height: 30px;
            padding: 10px;
            font-size: 15px;

            margin-bottom: 30px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="box" style="border-radius: 40px;">
        <form>
            <h1>Login</h1>
            <div >
                <label for="" style="display: block;">Username</label>
                <input type="text" placeholder="Enter Your name" style="display: block;">
            </div>
            <div>
                <label for="" style="display: block;">Password</label>
                <input type="text" placeholder="Enter Your password" style="display: block;">
            </div>
            <button style="width: 100%; height: 40px; font-size: 30px; background-color:   rgb(109, 167, 248); color: white; cursor: pointer;
">
                Login
            </button>



        </form>

    </div>

</body>

</html>
