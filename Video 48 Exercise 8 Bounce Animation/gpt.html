<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Parabolic Bounce</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #111;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .ball {
            position: absolute;
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #00f5ff, #008cff);
            border-radius: 50%;
            bottom: 0;
            left: 0;
            animation: moveX 4s linear forwards;
        }

        .ball::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: inherit;
            animation: bounceY 4s ease-out forwards;
        }

        /* Horizontal Movement */
        @keyframes moveX {
            from {
                left: 0;
            }

            to {
                left: calc(100% - 60px);
            }
        }

        /* Vertical Parabolic Bounce */
        @keyframes bounceY {
        0%   { transform: translateY(0); }
        20%  { transform: translateY(-300px); }
        40%  { transform: translateY(0); }
        55%  { transform: translateY(-150px); }
        70%  { transform: translateY(0); }
        80%  { transform: translateY(-70px); }
        90%  { transform: translateY(0); }
        95%  { transform: translateY(-30px); }
        100% { transform: translateY(0); }
    }

    </style>
</head>

<body>

    <div class="container">
        <div class="ball"></div>
    </div>

</body>

</html>
