<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            margin: 0;
            padding: 0;
            color: white
            ;
        }
        .container{

            height: 800px;
            width: 800px;
            display: grid;

            
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 2fr 2fr 1fr;

            background-color: black;
            width: 400px;
            height: 400px;

            gap: 5px;
            padding: 10px;

        }

        body{
            background-color: black;
            font-size: 30px;
        }

        .box{
            background-color: blue;
        }

        .Header{
            grid-column-start: 1;
            grid-column-end: 4;
        }
        
        
        .Sidebar{
            grid-row-start: 2;
            grid-row-end: 4;
        }
        
        .Content1{
            grid-column-start: 2;
            grid-column-end: 4;
        }

        .Footer{
            grid-column-start: 1;
            grid-column-end: 4;
        }
        

    </style>
</head>
<body>
    <div class="container">
        <div class="box Header">Header</div>
        <div class="box Sidebar">Sidebar</div>
        <div class="box Content1">Content1</div>
        <div class="box Content2">Content2</div>
        <div class="box Content3">Content3</div>
        <div class="box Footer">Footer</div>
    </div>
</body>
</html>
