<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Lyout using flexbox</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        body {
            background-color: black;
        }

        .container {
            display: flex;
            background-color: aqua;
            padding: 5px;
            gap: 5px;
        }

        .box {
            height: 300px;
            width: 200px;
        }

        .first {
            background-color: orange;
        }

        .second {
            display: flex;
            flex-direction: column;
            /* background-color: blue; */
            gap: 20px;
        }

        .child {
            height: 140px;
            background-color: red;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box first" style="color: white;">First</div>
        <div class="box second" style="color: white;">
            <div class="child">child1</div>
            <div class="child">child2</div>
        </div>
    </div>

</body>

</html>
