<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning</title>
    <style>
        *{
            margin: 0;padding: 0;
        }
        h2{
            background-color: orange;
            position: relative;
            left: 100px;
            top: 80px;
        }

        h3{
            background-color: pink;
            position: fixed;
            top: 0px;
        }

        h4{
            background-color: brown;
            position: sticky;
            top: 10px;
        }

        p{
            background-color: greenyellow;
            position: absolute;
            left: 50px;
            top:70px;
        }


    </style>
</head>
<body>
    <div style="background-color: aqua; height: 1400px;">

        <h1>Hello Bhavneesh</h1>
        <h2>Strike is coming soon</h2>
        <h3>I am the navigation bar</h3>
        <h4>I am the Best in the world</h4>
        <p>I am absolute last</p>
    </div>
    
</body>
</html>
