<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: black;
        }

        #container {
            position: relative;
            height: 200px;
            width: 300px;
            background-color: rgb(255, 255, 60);
        }

        .box {
            box-sizing: border-box;
            background-color: rgb(49, 49, 253);
        }

        .first,
        .third {
            height: 85px;
            width: 85px;
        }

        .third {
            bottom: 0px;
            position: absolute;
        }

        .second,
        .forth {
            height: 85px;
            width: 170px;
            position: absolute;

        }

        .second {
            top: 0px;
            right: 0px;
        }

        .forth {
            bottom: 0px;
            right: 0px;
        }
    </style>
</head>

<body>
    <div id="container">
        <div class="box first"></div>
        <div class="box second"></div>
        <div class="box third"></div>
        <div class="box forth"></div>
    </div>

</body>

</html>
