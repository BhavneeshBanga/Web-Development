<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modern Dark Navbar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background-color: #0f0f0f;
    }

    /* Navbar Container */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 50px;
      height: 70px;
      background: linear-gradient(90deg, #111, #1a1a1a);
      border-bottom: 1px solid #222;
    }

    /* Logo */
    .logo {
      color: #ffffff;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
    }

    /* Nav Links Container */
    .nav-links {
      display: flex;
      gap: 40px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: #ccc;
      font-size: 15px;
      transition: all 0.3s ease;
      position: relative;
    }

    .nav-links a:hover {
      color: #ffffff;
    }

    /* Underline animation */
    .nav-links a::after {
      content: "";
      position: absolute;
      width: 0%;
      height: 2px;
      bottom: -5px;
      left: 0;
      background-color: #00ffff;
      transition: width 0.3s ease;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    /* CTA Button */
    .cta-btn {
      padding: 8px 18px;
      border-radius: 20px;
      background: #00ffff;
      color: #000;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .cta-btn:hover {
      background: #00cccc;
      transform: scale(1.05);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .navbar {
        padding: 0 20px;
      }

      .nav-links {
        gap: 20px;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">BrandName</div>

    <ul class="nav-links">
      <li><a href="#">Products</a></li>
      <li><a href="#">Pricing</a></li>
      <li><a href="#">Resources</a></li>
      <li><a href="#">About us</a></li>
    </ul>

    <a href="#" class="cta-btn">Get Started</a>
  </nav>

</body>
</html>
