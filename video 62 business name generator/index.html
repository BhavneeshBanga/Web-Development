<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            font-size: 50px;
            margin: 0;
            color: white;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            /* background-color: black; */
            flex-direction: column;
        }

        .container {
            border-radius: 20px solid black;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            justify-content: center;
            align-items: center;
            background-color: rgb(0, 200, 255);
            height: 490px;
            width: 490px;
        }

        .box {
            border-radius: 20px solid black;

            flex-direction: column;
            display: flex;
            justify-content: center;
            align-items: center;

        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
        </div>
    </div>
    <script>
        const box = document.querySelector('.box');
        let firstname = "crazy,amazing,fire";
        let items1 = firstname.split(",");

        let secondname = "engineers,food,garments";
        let items2 = secondname.split(",");

        let thirdname = "bros,limited,hub";
        let items3 = thirdname.split(",");
        // console.log('items', items);



        function generateBusinessName() {
            const word1 = items1[Math.floor(Math.random() * items1.length)];
            const word2 = items2[Math.floor(Math.random() * items2.length)];
            const word3 = items3[Math.floor(Math.random() * items3.length)];
            return `${word1} ${word2} ${word3}`;
        }

        function displayBusinessName() {
            box.textContent = generateBusinessName();
        }

        setInterval(displayBusinessName, 2000); // Change name every 2 seconds


    </script>

</body>

</html>
