<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Name Generator</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0a0f;
            --card: #12121a;
            --accent: #00c8ff;
            --accent2: #7f5af0;
            --text: #f0eeff;
            --muted: rgba(240, 238, 255, 0.45);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background-image:
                radial-gradient(ellipse 60% 50% at 20% 10%, rgba(127, 90, 240, 0.18) 0%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 80% 90%, rgba(0, 200, 255, 0.12) 0%, transparent 70%);
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            font-weight: 800;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 2.5rem;
            text-align: center;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            width: min(440px, 100%);
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .name-box {
            width: 100%;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 200, 255, 0.05);
            border: 1px solid rgba(0, 200, 255, 0.15);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .name-box::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(127, 90, 240, 0.08), rgba(0, 200, 255, 0.08));
            pointer-events: none;
        }

        #nameDisplay {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.4rem, 5vw, 2.2rem);
            font-weight: 700;
            color: var(--text);
            line-height: 1.3;
            z-index: 1;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        #nameDisplay.fade {
            opacity: 0;
            transform: scale(0.95);
        }

        .inputs-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .input-group label {
            display: block;
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .input-group textarea {
            width: 100%;
            height: 72px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            padding: 8px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group textarea:focus {
            border-color: rgba(0, 200, 255, 0.4);
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        button {
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: all 0.2s;
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            color: #fff;
            border-color: transparent;
            flex: 1;
            min-width: 120px;
            font-size: 14px;
            letter-spacing: 0.03em;
        }

        .btn-primary:hover {
            filter: brightness(1.15);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.09);
        }

        .btn-secondary:active {
            transform: scale(0.97);
        }

        .auto-indicator {
            display: none;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: var(--muted);
        }

        .auto-indicator.active {
            display: flex;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        footer {
            margin-top: 2rem;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <h1>Business Name Generator</h1>

    <div class="card">
        <div class="name-box">
            <div id="nameDisplay">Click Generate</div>
        </div>

        <div class="inputs-grid">
            <div class="input-group">
                <label>Word 1</label>
                <textarea id="w1">crazy,amazing,fire,bold,ultra</textarea>
            </div>
            <div class="input-group">
                <label>Word 2</label>
                <textarea id="w2">engineers,food,garments,tech,solutions</textarea>
            </div>
            <div class="input-group">
                <label>Word 3</label>
                <textarea id="w3">bros,limited,hub,co,studio</textarea>
            </div>
        </div>

        <div class="controls">
            <button class="btn-primary" onclick="generate()">⚡ Generate</button>
            <button class="btn-secondary" id="autoBtn" onclick="toggleAuto()">▶ Auto</button>
            <button class="btn-secondary" id="copyBtn" onclick="copyName()">Copy</button>
        </div>

        <div class="auto-indicator" id="autoIndicator">
            <span class="dot"></span> Auto-generating every 2 seconds
        </div>
    </div>

    <footer>No arrays were used in this process</footer>

    <script>
        let timer = null;
        let currentName = '';

        function pick(str) {
            let words = str.split(',').map(s => s.trim()).filter(Boolean).join(',');
            if (!words) return '?';
            let parts = words.split(',');
            return parts[Math.floor(Math.random() * parts.length)];
        }

        function generate() {
            const el = document.getElementById('nameDisplay');
            el.classList.add('fade');
            setTimeout(() => {
                currentName =
                    pick(document.getElementById('w1').value) + ' ' +
                    pick(document.getElementById('w2').value) + ' ' +
                    pick(document.getElementById('w3').value);
                el.textContent = currentName;
                el.classList.remove('fade');
            }, 200);
        }

        function toggleAuto() {
            const btn = document.getElementById('autoBtn');
            const ind = document.getElementById('autoIndicator');
            if (timer) {
                clearInterval(timer);
                timer = null;
                btn.textContent = '▶ Auto';
                ind.classList.remove('active');
            } else {
                generate();
                timer = setInterval(generate, 2000);
                btn.textContent = '⏹ Stop';
                ind.classList.add('active');
            }
        }

        function copyName() {
            if (!currentName) return;
            navigator.clipboard.writeText(currentName).catch(() => { });
            const btn = document.getElementById('copyBtn');
            btn.textContent = '✓ Copied!';
            setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
        }

        generate();
    </script>
</body>

</html>
