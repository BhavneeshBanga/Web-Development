<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player: Music for everyone</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/utility.css">

</head>

<body>

    <div class="container flex bg-black">

        <div class="left ">
            <div class="close">
                <img class="invert close" src="img/close.svg" alt="">
            </div>
            <div class="home bg-grey rounded m-1 p-1">
                <div class="logo invert"><img class="invert" src="img/logo.svg" alt=""></div>
                <ul>
                    <li> <img class="invert" src="img/home.svg" alt="home">Home</li>
                    <li> <img class="invert" src="img/search.svg" alt="search">Search</li>
                </ul>
            </div>
            <div class="library rounded bg-grey p-1 m-1">
                <div class="heading">
                    <img class="invert" src="img/playlist.svg" alt="">
                    <h2>
                        YourLibrary
                    </h2>
                </div>

                <div class="songlist">
                    <ul>
                        
                    </ul>
                </div>
                <div class="footer">
                    <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>

                    <div>
                        <a href="https://www.spotify.com/jp/privacy/">
                            <span>Privacy Center</span>
                        </a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/jp/legal/privacy-policy/">
                            <span>Privacy Policy</span>
                        </a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/jp/legal/cookies-policy/">
                            <span>Cookies</span>
                        </a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/jp/legal/privacy-policy/#s3">
                            <span>About Ads</span>
                        </a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/jp/accessibility/">
                            <span>Accessibility</span>
                        </a>
                    </div>
                </div>
            </div>


        </div>
        <div class="right  bg-grey rounded ">
            <div class="header">
                <div class="nav">
                    <div class="hamburgercontainer">


                        <img class="hamburger invert" src="img/hamburger.svg" alt="">
                        <!-- Less Than (<) -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="29" height="29" viewBox="0 0 24 24" fill="white">

                            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
                        </svg>


                        <!-- Greater Than (>) -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="29" height="29" viewBox="0 0 24 24" fill="white">

                            <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z" />
                        </svg>
                    </div>

                </div>
                <div class="buttons">
                    <button class="signupbtn">Signup</button>
                    <button id="playsongg" class="loginbtn">Log in</button>
                </div>
            </div>


            <div class="spotifyPlaylist">
                <h1>Spotify Playlist</h1>
                <div class="cardContainer">

                </div>
                <div class="playbar">
                    <div class="seekbar">
                        <div class="circle">

                        </div>
                    </div>
                    <div class="abovebar">


                        <div class="songinfo">

                        </div>
                        <div class="songbuttons">
                            <img id="previous" class="playsongbutton playprevsongbutton" src="img/prevsong.svg" alt="">
                            <img id="play" class="playsongbutton" src="img/play.svg" alt="">
                            <img id="next" class="playsongbutton playnextsongbutton" src="img/nextsong.svg" alt="">
                        </div>
                        <div class="timevol">

                            <div class="songtime">

                            </div>
                            <div class="volume">
                                <img width="30" class="invert" src="img/volume.svg" alt="">
                                <div class="range">
                                    <input type="range" name="volume" class="volumekey" id="">
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="js/script.js"></script>
</body>

</html>
